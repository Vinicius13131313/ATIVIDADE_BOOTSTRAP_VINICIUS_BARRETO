<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Ordem de Serviço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #eeeeef;">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #302d35;">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold">Vinicius Nunes Barreto</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link " href="desafio01.html">Desafio 01</a></li>
                    <li class="nav-item"><a class="nav-link " href="desafio02.html">Desafio 02</a></li>
                    <li class="nav-item"><a class="nav-link " href="desafio03.html">Desafio 03</a></li>
                    <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
                    <li class="nav-item"><a class="nav-link " href="desafio05.html">Desafio 05</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4" style="color: #49323c;">Ordem de Serviço</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text">(41)</span>
                                    <input type="tel" class="form-control" placeholder="99999-9999" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Tipo de Serviço</label>
                                <select class="form-select" required>
                                    <option selected disabled value="">Escolha uma opção</option>
                                    <option>Manutenção de computador</option>
                                    <option>Formatação</option>
                                    <option>Troca de peças</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" rows="3"></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="termos" class="form-check-input" required>
                                    <label for="termos" class="form-check-label">Confirmo que as informações estão corretas.</label>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <button class="btn text-white w-100" style="background-color: #49323c;" type="submit">Enviar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
